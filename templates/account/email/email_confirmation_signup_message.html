<!DOCTYPE html>
<html>
<head>
    <title>Подтверждение регистрации</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; background-color: #f4f4f4; padding: 20px; }
        .container { background: #fff; padding: 20px; border-radius: 5px; max-width: 600px; margin: 0 auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn { display: inline-block; padding: 12px 25px; margin-top: 20px; background-color: #007bff; color: #fff !important; text-decoration: none; border-radius: 5px; }
        .footer { margin-top: 30px; font-size: 12px; color: #777; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="color: #333;">Здравствуйте, {{ user.username }}!</h2>
        <p>Благодарим за регистрацию на нашем сайте. Пожалуйста, подтвердите ваш адрес электронной почты, нажав на кнопку ниже.</p>

        <p><a href="{{ activate_url }}" class="btn">Подтвердить почту</a></p>

        <p>Если кнопка не работает, скопируйте эту ссылку: <br>
        <a href="{{ activate_url }}">{{ activate_url }}</a></p>

        <div class="footer">
            <p>С уважением,<br>Администрация сайта.</p>
        </div>
    </div>
</body>
</html>
